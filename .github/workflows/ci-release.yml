name: CI and release

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}

jobs:
  checks:
    name: Check Node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm run release:check
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm test

  node-release:
    name: Build Node release
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm run build:node
      - name: Test the extracted Node release
        run: |
          mkdir -p test-output/node-release
          tar -xzf dist/*-node.tgz -C test-output/node-release
          node scripts/smoke-node.mjs test-output/node-release/package
      - uses: actions/upload-artifact@v7
        with:
          name: release-node
          path: dist/*-node.tgz
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  electron-release:
    name: Build Electron release (Windows x64)
    needs: node-release
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run desktop:smoke
      - run: npm run build:win
      - name: Test the packaged Electron runtime
        run: node scripts/smoke-desktop.mjs "dist/win-unpacked/Vibe Photo Editor.exe"
      - name: Test portable EXE extraction and startup
        shell: pwsh
        run: |
          $portable = @(Get-ChildItem -LiteralPath dist -Filter 'Vibe-Photo-Editor-*-win-x64.exe')
          if ($portable.Count -ne 1) { throw 'Expected exactly one portable Windows EXE.' }
          node scripts/smoke-desktop.mjs $portable[0].FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v7
        with:
          name: release-electron
          path: dist/*-win-x64.exe
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Keep smoke diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: electron-smoke-diagnostics
          path: test-output/desktop-smoke-result.json
          retention-days: 7

  publish:
    name: Publish GitHub release
    needs: [node-release, electron-release]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: release
          merge-multiple: true
      - name: Generate download checksums
        working-directory: release
        run: sha256sum ./*-node.tgz ./*-win-x64.exe > SHA256SUMS.txt
      - name: Publish both verified downloads
        shell: bash
        run: |
          set -euo pipefail
          prerelease=false
          if [[ "$RELEASE_TAG" == *-* ]]; then prerelease=true; fi
          if draft=$(gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft'); then
            if [[ "$draft" != true ]]; then
              echo 'This release is already published; use a new version tag.' >&2
              exit 1
            fi
          else
            flags=()
            if [[ "$prerelease" == true ]]; then flags+=(--prerelease); fi
            gh release create "$RELEASE_TAG" --verify-tag --draft --generate-notes "${flags[@]}"
          fi
          gh release upload "$RELEASE_TAG" release/*-node.tgz release/*-win-x64.exe release/SHA256SUMS.txt --clobber
          gh release edit "$RELEASE_TAG" --draft=false --prerelease="$prerelease"
